[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "police-scanner"
version = "0.1.0"
description = "Pi 5 + 3x RTL-SDR police scanner with RadioReference ZIP-driven configuration."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "starlette>=0.36",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "sqlmodel>=0.0.16",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.19",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "passlib[bcrypt]>=1.7.4",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.1",
  "zeep>=4.2",
  "httpx>=0.27",
  "asyncio-mqtt>=0.16",
  "paho-mqtt>=1.6,<2.0",
  "websockets>=12.0",
  "slowapi>=0.1.9",
  "structlog>=24.1",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.3",
  "mypy>=1.8",
  "respx>=0.20",
]

[project.scripts]
police-scanner = "police_scanner.main:cli"

[tool.setuptools.packages.find]
where = ["server"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"server/tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
