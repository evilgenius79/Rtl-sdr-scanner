# Reference TLS reverse-proxy config for the scanner.
# Run `sudo certbot --nginx -d scanner.example.com` after installing this file
# at /etc/nginx/sites-available/police-scanner and symlinking into sites-enabled.

# Rate-limit zone: 30 req/s burst 60 per source IP, on top of the app's own limits.
limit_req_zone $binary_remote_addr zone=scanner:10m rate=30r/s;

# WebSocket upgrade map.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name scanner.example.com;
    # certbot will replace this with a TLS server block + 80 → 443 redirect.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name scanner.example.com;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/scanner.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scanner.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 110m;   # audio uploads from trunk-recorder are loopback-only,
                                 # but keep nginx generous in case you proxy other things.
    client_body_timeout 30s;
    keepalive_timeout 65s;

    # Hide nginx version
    server_tokens off;

    # Don't pass /api/tr/* from the public internet — that's the loopback
    # ingest endpoint for trunk-recorder. The app enforces this in code, but
    # block at the edge too.
    location /api/tr/ { return 404; }

    location / {
        limit_req zone=scanner burst=60 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;   # WebSocket idle timeout
        proxy_buffering off;       # streaming-friendly
    }
}
